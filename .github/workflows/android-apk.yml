name: Build Signed Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon clean :app:assembleRelease

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release-keystore.jks"

          test -s "$RUNNER_TEMP/release-keystore.jks"

      - name: Align and sign APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/open-escpos-print-service-signed.apk"
          TOOLS="$ANDROID_HOME/build-tools/37.0.0"

          test -f "$APK" || {
            echo "Expected release APK not found: $APK"
            find app/build/outputs/apk -type f -name '*.apk'
            exit 1
          }

          "$TOOLS/zipalign" -f -v 4 "$APK" "$ALIGNED"

          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release-keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          "$TOOLS/apksigner" verify --verbose "$SIGNED"

          rm -f "$RUNNER_TEMP/release-keystore.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: open-escpos-print-service-signed-apk
          path: app/build/outputs/apk/release/open-escpos-print-service-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/open-escpos-print-service-signed.apk
          generate_release_notes: true
