syntax = "proto3";

option java_package = "com.farminos.print";
option java_multiple_files = true;

enum Driver {
  ESC_POS = 0;
  CPCL = 1;
  TSPL = 2;
}

enum Interface {
  BLUETOOTH = 0;
  TCP_IP = 1;
  USB = 2;
}

// TSPL only: how the printer finds the start of the next label.
enum MediaType {
  GAP = 0;
  BLACK_MARK = 1;
  CONTINUOUS = 2;
}

enum Dithering {
  GRADIENT = 0;
  NONE = 1;
}

message PrinterSettings {
  bool enabled = 1;
  Driver driver = 2;
  int32 dpi = 3;
  float width = 4;
  float height = 5;
  float margin_left = 6;
  bool cut = 7;
  float speed_limit = 8;
  float cut_delay = 9;
  float margin_right = 10;
  float margin_top = 11;
  float margin_bottom = 12;
  string address = 13; // only for tcp/ip printers
  string name = 14; // only for tcp/ip printers
  Interface interface = 15;
  bool keep_alive = 16;
  bool skip_white_lines_at_page_end = 17;
  Dithering dithering = 18;
  MediaType media_type = 19; // tspl only
  float gap = 20;            // tspl only, cm between labels or black mark height
  int32 density = 21;        // tspl only, 1-15; 0 leaves the printer default
}

message Settings {
  string default_printer = 1;
  // bluetooth printers: mac address -> settings
  // ip printers: uuid -> settings
  // usb printers: vendorId:productId -> settings
  map<string, PrinterSettings> printers = 2;
}
